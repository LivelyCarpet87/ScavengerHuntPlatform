version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["@biomejs/biome", "typescript", "drizzle-kit", "playwright", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
